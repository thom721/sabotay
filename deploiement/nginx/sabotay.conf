# Config nginx SYSTÈME (pas Docker) — nginx est déjà installé et partagé
# entre plusieurs sites sur ce VPS. Ce fichier n'est pas monté automatiquement
# par docker-compose.yml : il faut l'installer manuellement sur l'hôte.
#
# Installation :
#   sudo cp deploiement/nginx/sabotay.conf /etc/nginx/sites-available/sabotay.conf
#   sudo ln -s /etc/nginx/sites-available/sabotay.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificats : chemins certbot standard (sudo certbot --nginx -d
# sabotay.infini-software.cloud génère et branche automatiquement le bloc
# HTTPS ci-dessous — dans ce cas, la section HTTPS ci-dessous peut être
# remplacée par ce que certbot génère). Server FastAPI accessible uniquement
# via 127.0.0.1:9004 (voir docker-compose.yml, `ports: 127.0.0.1:9004:9004`)
# — jamais exposé directement.

server {
    listen      80;
    server_name sabotay.infini-software.cloud;
    return 301  https://$host$request_uri;
}

server {
    listen      443 ssl;
    server_name sabotay.infini-software.cloud;

    ssl_certificate     /etc/letsencrypt/live/sabotay.infini-software.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sabotay.infini-software.cloud/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20M;

    # API FastAPI — le conteneur backend n'est joignable que sur
    # 127.0.0.1:9004 (voir docker-compose.yml), jamais directement depuis
    # Internet.
    location /api/v1/ {
        proxy_pass         http://127.0.0.1:9004/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:9004/health;
    }

    # Flutter web (SPA) — build statique déployé sur le VPS (chemin à
    # adapter selon l'organisation réelle du serveur ; PAS géré par
    # docker-compose.yml, à copier séparément après `flutter build web`,
    # en local ou en CI).
    root /var/www/sabotay-web;
    index index.html;

    # try_files retombe sur index.html pour toute route côté client
    # (go_router, usePathUrlStrategy) : sans ça, un accès direct ou un
    # rechargement sur /superadmin/login (par ex.) renverrait 404 au lieu de
    # laisser l'app Flutter gérer la route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets versionnés (main.dart.js, etc.) — cache long, le nom de
    # fichier change au contenu (géré par le build Flutter).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
